<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--a:#e9c58f;--t:#ffffff;--m:#d6ccbe;--zw:164px;--zh:529px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#030304;color:var(--t);font-family:Jost,"Century Gothic","Segoe UI",system-ui,sans-serif}
.c,#zone{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 50%,rgba(255,255,255,.05)),rgba(8,8,12,.58);border:1px solid rgba(255,255,255,.16);border-radius:26px;-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(255,255,255,.05),0 12px 40px rgba(0,0,0,.5)}
.c:before,#zone:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.2),transparent 48%)}
#zone{position:fixed;left:0;top:0;width:var(--zw);height:var(--zh);border-radius:0 26px 26px 0;border-left:0}
.c{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#rt .c{flex:1 1 0}#rt #nb{flex-grow:1.4}
h2{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin-bottom:6px}
.l{flex:1;min-height:0;overflow:auto}
.r{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:16px}
.r span{flex:1}.r small{color:var(--a)}.r.d span{text-decoration:line-through;opacity:.45}
button,input,textarea{font:inherit;color:inherit}
input,textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 10px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--a)}
input[type=checkbox]{width:auto;accent-color:var(--a)}
input[type=date]{color-scheme:dark}
textarea{flex:1;resize:none;line-height:1.5}
button{background:none;border:0;cursor:pointer;opacity:.7}button:hover{opacity:1}
.x{color:var(--m)}
.bt{border:1px solid var(--a);border-radius:12px;padding:6px 14px;color:var(--a);white-space:nowrap}
.add{display:flex;gap:6px;margin-top:8px}
.ch{display:flex;justify-content:space-between;align-items:center}.ch h2{margin:0}.ch button{font-size:18px;color:var(--t)}
.cg{display:grid;grid-template-columns:repeat(7,28px);gap:1px;justify-content:center;text-align:center;font-size:11px;margin-top:6px}
.cg b{color:var(--m);font-size:10px;font-weight:600}.cg i{font-style:normal}
.cg u{text-decoration:none;padding:4px 0;border-radius:9px;cursor:pointer;position:relative}
.cg u:hover{background:rgba(255,255,255,.1)}
.cg .td{background:var(--a);color:#2a1808;font-weight:600}
.cg .ev:after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--a)}
.cg .td.ev:after{background:#2a1808}
#gr{position:fixed;right:12px;top:8px;z-index:5;font-size:18px;display:flex;align-items:center;gap:8px;color:#fff;opacity:1;padding:7px 14px;border-radius:999px;background:rgba(8,8,12,.65);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#st{width:9px;height:9px;border-radius:50%;background:#556}
#st.ok{background:#4ade80}#st.err{background:#f87171}#st.busy{background:#fbbf24}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9}
#md[hidden]{display:none}
#md .c{width:min(460px,92vw);gap:8px;max-height:92vh;overflow:auto;background:rgba(20,17,15,.85)}
label{font-size:13px;color:var(--m);margin-top:4px}

#cl{padding:12px 14px}#cl h2{font-size:11px}
.c,#tm{text-shadow:0 1px 6px rgba(0,0,0,.75)}
::placeholder{color:rgba(255,255,255,.62)}
input,textarea{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.2)}
#sky{position:fixed;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 72%);mask-image:linear-gradient(90deg,#000 45%,transparent 72%)}
#bh{position:fixed;inset:0;width:100%;height:100%}
textarea{font-size:16px}
</style></head><body>
<canvas id="bh"></canvas><canvas id="sky"></canvas>
<div id="zone"></div>
<section id="tm">
 <div id="date"></div><div id="clock"></div>
 <div id="wx"></div>
 <div class="c" id="cl"><div class="ch"><button id="pv">&#8249;</button><h2 id="cm"></h2><button id="nx">&#8250;</button></div><div class="cg" id="cg"></div></div>
</section>
<aside id="rt">
 <div class="c"><h2>To do</h2><div class="l" id="tl"></div><div class="add"><input id="ti" placeholder="Add a task and press Enter"></div></div>
 <div class="c" id="nb"><h2>Notes</h2><textarea id="nt" placeholder="Write anything here"></textarea></div>
 <div class="c"><h2>Important dates</h2><div class="l" id="dl"></div>
  <div class="add"><input id="dn" placeholder="What is it?"></div>
  <div class="add"><input id="dv" type="date"><button class="bt" id="da">Add</button></div></div>
</aside>
<button id="gr" title="Settings"><span id="st"></span>&#9881;</button>
<div id="md" hidden><div class="c">
 <h2>Settings</h2>
 <label>Worker address</label><input id="su" placeholder="https://wallpaper-sync.yourname.workers.dev">
 <label>Sync key</label><input id="sy" type="password">
 <label>City for weather</label><div class="add" style="margin:0"><input id="sc" placeholder="City name"><button class="bt" id="sf">Find</button></div><small id="sm" style="color:var(--a)"></small>
 <label>Icon space on the left: columns and rows (medium icons)</label><div class="add" style="margin:0"><input id="zc" type="number" min="1" max="6"><input id="zr" type="number" min="1" max="12"></div>
 <div class="add"><button class="bt" id="ss">Save</button><button id="sz">Close</button></div>
</div></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const J=(k,d)=>{try{return JSON.parse(LS.getItem(k))||d}catch(e){return d}};
let cfg=J('wp_cfg',{}),D={todos:[],dates:[],notes:'',notesTs:0,dock:[],dockTs:0,...J('wp_data',{})},dirty=false,tm,cal=new Date();cal.setDate(1);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>LS.setItem('wp_data',JSON.stringify(D));
const dot=c=>$('#st').className=c;
function touch(){D.updatedAt=Date.now();dirty=true;save();clearTimeout(tm);tm=setTimeout(sync,4000)}
const mut=(a,i,f)=>{const o=a.find(x=>x.id==i);if(o){f(o);o.ts=Date.now();touch()}};
/* ---- sync: save locally first, merge with the server when online ---- */
const ml=(a=[],b=[])=>{const m={};[...a,...b].forEach(x=>{if(!m[x.id]||x.ts>m[x.id].ts)m[x.id]=x});return Object.values(m)};
const pick=(l,r,k)=>(l[k+'Ts']||0)>=(r[k+'Ts']||0)?l:r;
function merge(l,r){return{todos:ml(l.todos,r.todos),dates:ml(l.dates,r.dates),notes:pick(l,r,'notes').notes||'',notesTs:Math.max(l.notesTs||0,r.notesTs||0),dock:pick(l,r,'dock').dock||[],dockTs:Math.max(l.dockTs||0,r.dockTs||0),settings:{},updatedAt:Math.max(l.updatedAt||0,r.updatedAt||0)}}
const canon=d=>JSON.stringify([(d.todos||[]).map(x=>x.id+x.ts).sort(),(d.dates||[]).map(x=>x.id+x.ts).sort(),d.notesTs||0,d.dockTs||0]);
async function sync(){
 if(!cfg.url||!cfg.key)return dot('');
 dot('busy');
 try{
  const H={'X-Sync-Key':cfg.key};
  let r=await fetch(cfg.url,{headers:H});if(!r.ok)throw 0;
  const rem=await r.json(),m=merge(D,rem),need=dirty||canon(m)!==canon(rem);
  D=m;save();render();
  if(need){r=await fetch(cfg.url,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(D)});if(!r.ok)throw 0}
  dirty=false;dot('ok')
 }catch(e){dot('err')}
}
/* ---- render ---- */
function render(){rTodo();rDates();rCal();const n=$('#nt');if(document.activeElement!==n)n.value=D.notes||''}
function rTodo(){
 const a=D.todos.filter(x=>!x.del).sort((p,q)=>(p.done?1:0)-(q.done?1:0)||p.ts-q.ts);
 $('#tl').innerHTML=a.map(x=>`<div class="r ${x.done?'d':''}"><input type="checkbox" ${x.done?'checked':''} data-i="${x.id}"><span>${esc(x.t)}</span><button class="x" data-x="${x.id}">&#10005;</button></div>`).join('')||'<div class="r"><span style="opacity:.4">Nothing to do yet</span></div>'}
const T0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dd=s=>Math.round((new Date(s+'T00:00')-T0())/864e5);
function rDates(){
 const a=D.dates.filter(x=>!x.del&&dd(x.d)>=0).sort((p,q)=>p.d<q.d?-1:1);
 $('#dl').innerHTML=a.map(x=>{const n=dd(x.d);return `<div class="r"><span>${esc(x.n)}</span><small>${n==0?'today':n==1?'tomorrow':n+' days'}</small><button class="x" data-x="${x.id}">&#10005;</button></div>`}).join('')||'<div class="r"><span style="opacity:.4">No upcoming dates</span></div>'}
function rCal(){
 const y=cal.getFullYear(),m=cal.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=new Date(),set=new Set(D.dates.filter(x=>!x.del).map(x=>x.d));
 $('#cm').textContent=cal.toLocaleDateString([],{month:'long',year:'numeric'});
 let h=['M','T','W','T','F','S','S'].map(x=>`<b>${x}</b>`).join('');
 for(let i=0;i<f;i++)h+='<i></i>';
 for(let d=1;d<=n;d++){const s=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  h+=`<u class="${t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?'td':''} ${set.has(s)?'ev':''}" data-d="${s}">${d}</u>`}
 $('#cg').innerHTML=h}
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});$('#date').textContent=d.toLocaleDateString([],{weekday:'long'})}
/* ---- weather (Open-Meteo, cached for offline) ---- */
const WX=c=>c==0?'Clear':c<4?'Partly cloudy':c<50?'Fog':c<60?'Drizzle':c<70?'Rain':c<80?'Snow':c<83?'Showers':c<90?'Snow showers':'Thunderstorm';
function showWx(j){$('#wx').textContent=[cfg.city,Math.round(j.current.temperature_2m)+'\u00B0',WX(j.current.weather_code)].filter(Boolean).join('  \u00B7  ')}
async function wx(){
 if(!cfg.lat){$('#wx').textContent='Set your city in settings';return}
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);const j=await r.json();LS.setItem('wp_wx',JSON.stringify(j));showWx(j)}
 catch(e){const j=J('wp_wx',null);if(j)showWx(j)}}
/* ---- events ---- */
$('#ti').onkeydown=e=>{const v=e.target.value.trim();if(e.key=='Enter'&&v){D.todos.push({id:uid(),t:v,done:false,ts:Date.now()});e.target.value='';touch();rTodo()}};
$('#tl').onclick=e=>{const i=e.target.dataset.x;if(i){mut(D.todos,i,x=>x.del=true);rTodo()}};
$('#tl').onchange=e=>{mut(D.todos,e.target.dataset.i,x=>x.done=e.target.checked);rTodo()};
$('#da').onclick=()=>{const n=$('#dn').value.trim(),d=$('#dv').value;if(n&&d){D.dates.push({id:uid(),n,d,ts:Date.now()});$('#dn').value='';touch();rDates();rCal()}};
$('#dl').onclick=e=>{const i=e.target.dataset.x;if(i){mut(D.dates,i,x=>x.del=true);rDates();rCal()}};
$('#cg').onclick=e=>{const d=e.target.dataset.d;if(d){$('#dv').value=d;$('#dn').focus()}};
$('#pv').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);rCal()};
$('#nx').onclick=()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);rCal()};
$('#nt').oninput=e=>{D.notes=e.target.value;D.notesTs=Date.now();touch()};
$('#gr').onclick=openSet;$('#clock').ondblclick=openSet;$('#sz').onclick=()=>$('#md').hidden=true;
function openSet(){$('#su').value=cfg.url||'';$('#sy').value=cfg.key||'';$('#sc').value=cfg.city||'';$('#sm').textContent='';
 $('#zc').value=cfg.zc||2;$('#zr').value=cfg.zr||5;$('#md').hidden=false}
$('#sf').onclick=async()=>{const q=$('#sc').value.trim();if(!q)return;
 try{const j=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).json(),p=j.results&&j.results[0];
  if(p){cfg.lat=p.latitude;cfg.lon=p.longitude;cfg.city=p.name;$('#sm').textContent='Found: '+p.name+', '+(p.country||'')}else $('#sm').textContent='City not found. Try another spelling.'}
 catch(e){$('#sm').textContent='Could not search. Check your connection.'}};
$('#ss').onclick=()=>{
 cfg.url=$('#su').value.trim();cfg.key=$('#sy').value.trim();LS.setItem('wp_cfg',JSON.stringify(cfg));
 cfg.zc=+$('#zc').value||2;cfg.zr=+$('#zr').value||5;LS.setItem('wp_cfg',JSON.stringify(cfg));side();wx();sync();$('#md').hidden=true};
/* ---- moving night sky: stars slowly orbit the black hole ---- */
const cv=$('#sky'),x=cv.getContext('2d');let S=[],sh=null,px=0,py=0,t0=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight;const sc=Math.max(cv.width/1489,cv.height/833);px=(1700-744.5)*sc+cv.width/2;py=(410-416.5)*sc+cv.height/2;
 const R=Math.hypot(Math.max(px,cv.width-px),Math.max(py,cv.height-py));
 S=Array.from({length:Math.round(Math.PI*R*R/15000)},()=>({r:R*Math.sqrt(Math.random()),a:Math.random()*6.283,z:Math.random()*1.3+.4,p:Math.random()*6.3,s:Math.random()*.0008+.0003}))}
function fr(t){
 const dt=Math.min((t-t0)/1000,.1);t0=t;
 x.clearRect(0,0,cv.width,cv.height);x.fillStyle='#fff6e6';
 for(const s of S){s.a+=.003*dt*(.6+s.z*.4);const X=px+s.r*Math.cos(s.a),Y=py+s.r*Math.sin(s.a);
  if(X<0||Y<0||X>cv.width||Y>cv.height)continue;
  x.globalAlpha=.2+.6*Math.abs(Math.sin(s.p+t*s.s));x.fillRect(X,Y,s.z,s.z)}
 if(!sh&&Math.random()<.002)sh={x:Math.random()*cv.width*.5,y:Math.random()*cv.height*.4,l:0};
 if(sh){const k=++sh.l;x.globalAlpha=Math.max(0,1-k/50);x.strokeStyle='#fff6e6';x.lineWidth=1.5;x.beginPath();x.moveTo(sh.x+k*9,sh.y+k*4.5);x.lineTo(sh.x+k*9-60,sh.y+k*4.5-30);x.stroke();if(k>50)sh=null}
 requestAnimationFrame(fr)}
/* ---- spinning black hole: a shader slowly swirls the glowing ring ---- */
const HX=1700,HY=410,HR=525,IW=1489,IH=833; /* hole centre and radius, in image pixels */
function initBH(){
 const cb=$('#bh'),g=cb.getContext('webgl');if(!g)return;
 const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
 const FS=`precision highp float;uniform sampler2D T;uniform vec2 R,I,C;uniform float t,hr;
vec2 flow(vec2 q,float k){
vec2 v=q-C;float d=length(v)/hr;float w=smoothstep(.95,1.1,d)*(1.-smoothstep(1.3,1.9,d));
float c=cos(k*.13*w),s=sin(k*.13*w);q=C+vec2(c*v.x-s*v.y,s*v.x+c*v.y);
float e=abs((q.y-(470.-.22*(q.x-1170.)))*.976);float m=1.-smoothstep(70.,150.,e);
return q-vec2(.977,-.215)*k*150.*m;}
void main(){vec2 p=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);float sc=max(R.x/I.x,R.y/I.y);vec2 q=(p-R*.5)/sc+I*.5;
float a=fract(t/10.),b=fract(t/10.+.5);
vec4 A=texture2D(T,flow(q,a-.5)/I),B=texture2D(T,flow(q,b-.5)/I);
gl_FragColor=mix(B,A,1.-abs(2.*a-1.));}`;
 const mk=(ty,src)=>{const o=g.createShader(ty);g.shaderSource(o,src);g.compileShader(o);return o};
 const pr=g.createProgram();g.attachShader(pr,mk(g.VERTEX_SHADER,VS));g.attachShader(pr,mk(g.FRAGMENT_SHADER,FS));g.linkProgram(pr);
 if(!g.getProgramParameter(pr,g.LINK_STATUS)){console.warn('black hole shader failed');return}
 g.useProgram(pr);
 const bf=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,bf);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
 const al=g.getAttribLocation(pr,'a');g.enableVertexAttribArray(al);g.vertexAttribPointer(al,2,g.FLOAT,false,0,0);
 const U=n=>g.getUniformLocation(pr,n),uR=U('R'),ut=U('t');
 g.uniform2f(U('I'),IW,IH);g.uniform2f(U('C'),HX,HY);g.uniform1f(U('hr'),HR);
 const fit=()=>{cb.width=innerWidth;cb.height=innerHeight;g.viewport(0,0,cb.width,cb.height);g.uniform2f(uR,cb.width,cb.height)};
 fit();addEventListener('resize',fit);
 const im=new Image();
 im.onload=()=>{const tx=g.createTexture();g.bindTexture(g.TEXTURE_2D,tx);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);
  g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);
  g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,im);
  let last=0;const loop=ms=>{if(ms-last>33){last=ms;g.uniform1f(ut,ms/1000);g.drawArrays(g.TRIANGLE_STRIP,0,4)}requestAnimationFrame(loop)};requestAnimationFrame(loop)};
 im.src=getComputedStyle(document.body).backgroundImage.replace(/^url\(["']?/,'').replace(/["']?\)$/,'');
}
/* ---- start ---- */
function side(){const c=cfg.zc||2,r=cfg.zr||5,st=document.documentElement.style;st.setProperty('--zw',c*75+14+'px');st.setProperty('--zh',r*103+14+'px')}
side();tick();setInterval(tick,1000);render();wx();setInterval(wx,12e5);
sync();setInterval(sync,12e4);addEventListener('online',sync);
setInterval(()=>{rDates();rCal()},6e4);
initBH();rs();addEventListener('resize',rs);requestAnimationFrame(fr);
if(!cfg.url)openSet();
</script></body></html>
