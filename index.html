<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Masnry · Desktop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070a;
      --accent: #6b8cff;
      --accent2: #5be6c0;
      --text: #e6eef6;
      --muted: #94a3b8;
      --border: rgba(255,255,255,.08);
      --radius: 16px;
      --font: 'Oxanium', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: var(--font); background: var(--bg); color: var(--text);
      user-select: none; -webkit-font-smoothing: antialiased;
    }
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .glow-orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
    .glow-orb.a { width: 600px; height: 600px; top: -150px; left: -100px; background: radial-gradient(circle, rgba(107,140,255,.10), transparent 70%); }
    .glow-orb.b { width: 500px; height: 500px; bottom: -100px; right: -80px; background: radial-gradient(circle, rgba(91,230,192,.08), transparent 70%); }
    .glow-orb.c { width: 300px; height: 300px; top: 40%; left: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(107,140,255,.05), transparent 70%); }
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(107,140,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(107,140,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .rain { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .drop { position: absolute; top: -40px; width: 1px; height: 32px; background: linear-gradient(to bottom, transparent, rgba(107,140,255,.3)); animation: fall linear infinite; border-radius: 1px; }
    @keyframes fall { to { transform: translateY(110vh); } }
    .scanline { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.025) 2px, rgba(0,0,0,.025) 4px); }

    #app {
      position: relative; z-index: 10; width: 100vw; height: 100vh;
      display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      grid-template-rows: 1fr; gap: 24px; padding: 28px;
    }
    .panel {
      background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: var(--radius);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 20px;
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(107,140,255,.03), transparent 60%);
      pointer-events: none; border-radius: var(--radius);
    }
    #notes-panel { display: flex; flex-direction: column; min-height: 0; }
    #notes-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-shrink: 0; }
    .panel-title { font-size: .95rem; font-weight: 700; letter-spacing: .04em; color: var(--text); }
    #save-status { color: var(--muted); font-size: .62rem; letter-spacing: .05em; }
    #notes-content { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(107,140,255,.25) transparent; display: flex; flex-direction: column; gap: 16px; padding: 2px 3px 4px 0; }
    .note-section { display: flex; flex-direction: column; flex-shrink: 0; }
    .note-label { color: var(--muted); font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 7px 2px; }
    .note-box {
      min-height: 105px; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: rgba(255,255,255,.025); color: var(--text); font: 400 .82rem/1.65 var(--font);
      outline: none; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .note-box:empty::before { content: attr(data-placeholder); color: rgba(148,163,184,.65); pointer-events: none; }
    .note-box:focus { border-color: rgba(107,140,255,.4); box-shadow: 0 0 0 2px rgba(107,140,255,.07), 0 0 18px rgba(107,140,255,.05); background: rgba(255,255,255,.035); }
    #clock-panel { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 14vh 20px 22px; min-width: 0; }
    #time-display {
      font-size: clamp(4rem, 8vw, 7rem); font-weight: 800; letter-spacing: -.04em;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 65%);
      -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1;
      filter: drop-shadow(0 0 40px rgba(107,140,255,.45));
    }
    #date-display { font-size: .92rem; color: var(--muted); letter-spacing: .08em; margin-top: 10px; text-transform: uppercase; text-align: center; }
    .particle { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; background: var(--accent); animation: float-up linear infinite; }
    @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: var(--op); } 100% { transform: translateY(-100vh) scale(0); opacity: 0; } }
    #flash { position: fixed; inset: 0; z-index: 50; background: rgba(107,140,255,.05); pointer-events: none; opacity: 0; transition: opacity .05s; }
    #photo-bg {
      position: fixed; bottom: -160px; left: 50%; transform: translateX(-50%); height: 80vh; width: auto;
      z-index: 3; pointer-events: none; opacity: .5; mix-blend-mode: screen;
      -webkit-mask-image: radial-gradient(ellipse 80% 72% at 57% 58%, #000 45%, rgba(0,0,0,.5) 65%, transparent 90%);
      mask-image: radial-gradient(ellipse 75% 70% at 60% 25%, #000 40%, rgba(0,0,0,.5) 62%, transparent 85%);
    }
    @media (max-width: 760px) {
      html, body { overflow: auto; }
      #app { min-height: 100vh; height: auto; grid-template-columns: 1fr; grid-template-rows: auto auto; gap: 14px; padding: 16px; }
      #clock-panel { grid-row: 1; padding: 7vh 8px 4vh; }
      #notes-panel { grid-row: 2; min-height: 55vh; }
      #time-display { font-size: clamp(3.2rem, 14vw, 6rem); }
      #photo-bg { height: 55vh; opacity: .3; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="glow-orb a" aria-hidden="true"></div>
  <div class="glow-orb b" aria-hidden="true"></div>
  <div class="glow-orb c" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="rain" id="rain" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>
  <img id="photo-bg" src="cat.png" alt="">

  <main id="app">
    <section id="notes-panel" class="panel" aria-label="Notes">
      <header id="notes-header">
        <h1 class="panel-title">📋 Notes</h1>
        <span id="save-status" role="status" aria-live="polite">SAVED ON THIS PC</span>
      </header>
      <div id="notes-content">
        <section class="note-section">
          <h2 class="note-label">Todo</h2>
          <div class="note-box" contenteditable="true" role="textbox" aria-label="Todo notes" aria-multiline="true" spellcheck="false" data-note="todo" data-placeholder="Add tasks to do…"></div>
        </section>
        <section class="note-section">
          <h2 class="note-label">Assessments</h2>
          <div class="note-box" contenteditable="true" role="textbox" aria-label="Assessment notes" aria-multiline="true" spellcheck="false" data-note="assessments" data-placeholder="Track assessments and due dates…"></div>
        </section>
        <section class="note-section">
          <h2 class="note-label">Important Dates</h2>
          <div class="note-box" contenteditable="true" role="textbox" aria-label="Important dates" aria-multiline="true" spellcheck="false" data-note="important-dates" data-placeholder="Add important dates…"></div>
        </section>
      </div>
    </section>

    <section id="clock-panel" aria-label="Clock">
      <div id="time-display">00:00:00</div>
      <div id="date-display"></div>
    </section>
  </main>

  <script>
    // Decorative rain drops.
    (() => {
      const rain = document.getElementById('rain');
      for (let i = 0; i < 120; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';
        drop.style.left = `${Math.random() * 100}vw`;
        drop.style.animationDuration = `${(Math.random() * 2.5 + 1.8).toFixed(2)}s`;
        drop.style.animationDelay = `${(-Math.random() * 5).toFixed(2)}s`;
        drop.style.opacity = (Math.random() * .45 + .04).toFixed(2);
        drop.style.height = `${Math.random() * 22 + 14}px`;
        rain.appendChild(drop);
      }
    })();

    // Subtle floating particles.
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      const size = Math.random() * 2.5 + .5;
      particle.className = 'particle';
      particle.style.cssText = `left:${Math.random() * 100}%;bottom:-10px;width:${size}px;height:${size}px;--op:${(Math.random() * .12 + .02).toFixed(3)};animation-duration:${(Math.random() * 18 + 10).toFixed(1)}s;animation-delay:${(-Math.random() * 20).toFixed(1)}s`;
      document.body.appendChild(particle);
    }

    // Animated aurora lines.
    (() => {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0, time = 0;
      const resize = () => {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      };
      window.addEventListener('resize', resize);
      resize();
      const lines = Array.from({ length: 5 }, (_, i) => ({
        phase: i / 5 * Math.PI * 2, amp: 60 + i * 20, speed: .0004 + i * .00015,
        y: .2 + i * .15, alpha: .015 + i * .005
      }));
      function draw() {
        ctx.clearRect(0, 0, width, height);
        time += .6;
        for (const line of lines) {
          ctx.beginPath();
          for (let x = 0; x <= width; x += 3) {
            const y = height * line.y + Math.sin(x * .004 + time * line.speed * 1000 + line.phase) * line.amp;
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = `rgba(107,140,255,${line.alpha})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Local clock.
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const pad = value => String(value).padStart(2, '0');
    function updateClock() {
      const now = new Date();
      document.getElementById('time-display').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('date-display').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Notes are saved in this wallpaper's browser storage; no localhost server is needed.
    (() => {
      const storageKey = 'masnry-desktop-wallpaper-notes-v1';
      const status = document.getElementById('save-status');
      const editors = [...document.querySelectorAll('[data-note]')];
      let saveTimer;
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        for (const editor of editors) {
          editor.textContent = typeof saved[editor.dataset.note] === 'string' ? saved[editor.dataset.note] : '';
        }
      } catch {
        status.textContent = 'LOCAL STORAGE UNAVAILABLE';
      }
      function saveNotes() {
        const notes = Object.fromEntries(editors.map(editor => [editor.dataset.note, editor.innerText]));
        try {
          localStorage.setItem(storageKey, JSON.stringify(notes));
          status.textContent = 'SAVED ON THIS PC';
        } catch {
          status.textContent = 'COULD NOT SAVE';
        }
      }
      for (const editor of editors) {
        editor.addEventListener('input', () => {
          status.textContent = 'SAVING…';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveNotes, 250);
        });
      }
      window.addEventListener('beforeunload', saveNotes);
    })();

    // Occasional decorative lightning flash.
    (function lightningLoop() {
      const delay = 8000 + Math.random() * 20000;
      setTimeout(() => {
        const flash = document.getElementById('flash');
        flash.style.opacity = '1';
        setTimeout(() => {
          flash.style.opacity = '0';
          setTimeout(() => {
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; lightningLoop(); }, 80);
          }, 120);
        }, 60);
      }, delay);
    })();
  </script>
</body>
</html>
